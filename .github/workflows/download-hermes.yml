name: Build repository downloads
run-name: Download ${{ inputs.repositories }}

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: '仓库 ID，多个用英文逗号分隔；all 表示全部（见 repositories.json）'
        required: true
        default: hermes-agent
        type: string
      ref:
        description: '覆盖所选仓库的分支或标签；留空使用各仓库配置'
        required: false
        type: string
      full_history:
        description: '包含所选分支的完整 Git 历史（更大、更慢）'
        default: false
        type: boolean
      submodules:
        description: '递归下载子模块'
        default: true
        type: boolean
      include_lfs:
        description: '下载 Git LFS 大文件（更大、更慢）'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select repositories
        id: select
        env:
          REPOSITORIES: ${{ inputs.repositories }}
          REF_OVERRIDE: ${{ inputs.ref }}
        run: python3 scripts/download_repositories.py select

  download:
    needs: select
    name: Download ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify archive
        env:
          REPOSITORY_ENTRY: ${{ toJSON(matrix) }}
          FULL_HISTORY: ${{ inputs.full_history }}
          SUBMODULES: ${{ inputs.submodules }}
          INCLUDE_LFS: ${{ inputs.include_lfs }}
        run: python3 scripts/download_repositories.py package
      - name: Upload downloadable archive
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-with-git-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Show download link
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          REPOSITORY_ID: ${{ matrix.id }}
        run: |
          printf '### %s\n\n[下载源码包](%s)\n\n包含 Git 信息、COMMIT.txt、SOURCE.json 和 SHA256SUMS.txt。需登录 GitHub，保留 14 天。\n' "$REPOSITORY_ID" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
